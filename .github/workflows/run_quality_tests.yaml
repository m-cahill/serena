name: Quality Tests

on:
  push:
    branches: [main]

jobs:
  quality:
    name: quality tests
    runs-on: ubuntu-latest
    steps:
      - name: Verify repository
        run: |
          if [ "$GITHUB_REPOSITORY" != "m-cahill/serena" ]; then
            echo "::error::Serena CI must run only inside m-cahill/serena, not $GITHUB_REPOSITORY"
            exit 1
          fi
      - name: Verify ref
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Quality workflow must run on push to main, not $GITHUB_REF"
            exit 1
          fi
      - name: Checkout Code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - name: Set up Python 3.10
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: 3.10.6
          cache: pip
          cache-dependency-path: |
            **/requirements*txt
            requirements-ci.txt
            launch.py
      - name: Cache models
        id: cache-models
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: models
          key: "2023-12-30"
      # Locked tree (no OpenAI CLIP — uv lock + PEP 517 cannot build that GitHub archive on CI).
      - name: Install locked CI dependencies
        run: pip install -r requirements-ci.txt
        env:
          PIP_DISABLE_PIP_VERSION_CHECK: "1"
          PIP_PROGRESS_BAR: "off"
      # Pinned commit matches pre-M26. GHA pip has no --no-use-pep517; install from extracted
      # tree so setuptools uses setup.py (same as legacy `pip install ...zip --no-build-isolation`).
      - name: Install OpenAI CLIP (pinned archive)
        run: |
          CLIP_SHA=d50d76daa670286dd6cacf3bcd80b5e4823fc8e1
          curl -fsSL -o /tmp/clip.zip "https://github.com/openai/CLIP/archive/${CLIP_SHA}.zip"
          unzip -qo /tmp/clip.zip -d /tmp
          pip install --no-build-isolation "/tmp/CLIP-${CLIP_SHA}"
        env:
          PIP_DISABLE_PIP_VERSION_CHECK: "1"
          PIP_PROGRESS_BAR: "off"
      # Must run before pip-audit: installing pip-audit can upgrade shared deps (e.g. requests).
      - name: Verify lockfile vs environment
        run: bash scripts/ci/verify_pinned_deps.sh requirements-ci.txt dependency_snapshot.txt
      # Informational until M28: strict pip-audit would require dep upgrades (behavior surface).
      - name: Dependency vulnerability scan
        shell: bash
        run: |
          pip install pip-audit
          set +o pipefail
          pip-audit | tee pip_audit_report.txt
          audit_rc=${PIPESTATUS[0]}
          set -o pipefail
          if [ "$audit_rc" -ne 0 ]; then
            echo "::warning title=pip-audit vulnerabilities detected::See pip_audit_report.txt artifact. Strict enforcement deferred to M28."
          fi
        env:
          PIP_DISABLE_PIP_VERSION_CHECK: "1"
          PIP_PROGRESS_BAR: "off"
      - name: Capture CI environment metadata
        run: |
          {
            echo "# Serena Quality CI environment (M27)"
            date -u "+%Y-%m-%dT%H:%M:%SZ"
            python --version
            pip --version
            echo ""
            echo "# requirements-ci.txt digest"
            sha256sum requirements-ci.txt
          } > ci_environment.txt
      - name: Prepare pip freeze artifact
        run: cp dependency_snapshot.txt pip_freeze.txt
      - name: Create stub repositories
        run: python scripts/dev/create_stub_repos.py
      - name: Setup environment
        run: python launch.py --skip-prepare-environment --skip-torch-cuda-test --exit
        env:
          PIP_DISABLE_PIP_VERSION_CHECK: "1"
          PIP_PROGRESS_BAR: "off"
          TORCH_INDEX_URL: https://download.pytorch.org/whl/cpu
          WEBUI_LAUNCH_LIVE_OUTPUT: "1"
          PYTHONUNBUFFERED: "1"
      - name: Smoke startup
        run: |
          python launch.py --skip-prepare-environment --skip-torch-cuda-test --test-server --use-cpu all --exit
      - name: Start test server
        run: >
          python -m coverage run
          --data-file=.coverage.server
          launch.py
          --skip-prepare-environment
          --skip-torch-cuda-test
          --test-server
          --do-not-download-clip
          --no-half
          --disable-opt-split-attention
          --use-cpu all
          --api-server-stop
          --port 7860
          2>&1 | tee output.txt &
      - name: Run quality tests
        run: |
          wait-for-it --service 127.0.0.1:7860 -t 20
          python -m pytest test/smoke test/quality -vv --junitxml=test/results.xml --cov . --cov-report=xml --cov-report=term --verify-base-url
      - name: Kill test server
        if: always()
        run: curl -vv -XPOST http://127.0.0.1:7860/sdapi/v1/server-stop && sleep 10
      - name: Show coverage
        run: |
          python -m coverage combine .coverage*
          python -m coverage report -i
          python -m coverage report --fail-under=42 -i
          python -m coverage xml -i
          python -m coverage html -i
      - name: Radon cyclomatic complexity (modules)
        run: |
          pip install radon
          radon cc modules -s -a > radon_report.txt
        env:
          PIP_DISABLE_PIP_VERSION_CHECK: "1"
          PIP_PROGRESS_BAR: "off"
      - name: Complexity warning (grade D/E/F only)
        shell: bash
        run: |
          if [ -f radon_report.txt ] && grep -qE ' - [DEF] \(' radon_report.txt; then
            echo "::warning title=High complexity detected::Cyclomatic complexity grade D/E/F in modules/ — see radon_report.txt artifact."
          fi
      - name: Upload main app output
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: output
          path: output.txt
      - name: Upload coverage HTML
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: htmlcov
          path: htmlcov
      - name: Upload coverage XML
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: coverage-xml
          path: coverage.xml
      - name: Upload CI environment
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: ci-environment
          path: ci_environment.txt
      - name: Upload pip freeze
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: pip-freeze
          path: pip_freeze.txt
      - name: Upload dependency snapshot
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: dependency-snapshot
          path: dependency_snapshot.txt
      - name: Upload pip-audit report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: pip-audit-report
          path: pip_audit_report.txt
      - name: Upload radon report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: radon-report
          path: radon_report.txt
