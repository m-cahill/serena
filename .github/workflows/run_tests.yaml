name: Tests

on:
  - push
  - pull_request

jobs:
  test:
    name: tests on CPU with empty model
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - name: Set up Python 3.10
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: 3.10.6
          cache: pip
          cache-dependency-path: |
            **/requirements*txt
            launch.py
      - name: Cache models
        id: cache-models
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: models
          key: "2023-12-30"
      - name: Cache repositories
        id: cache-repos
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: repositories
          key: "repos-2023-12-30"
      - name: Install test dependencies
        run: pip install wait-for-it -r requirements-test.txt
        env:
          PIP_DISABLE_PIP_VERSION_CHECK: "1"
          PIP_PROGRESS_BAR: "off"
      - name: Install base build tools
        run: |
          python -m pip install --upgrade pip
          pip install setuptools wheel
      - name: Dependency vulnerability scan
        run: |
          pip install pip-audit
          pip-audit || true
      - name: Setup environment
        run: python launch.py --skip-torch-cuda-test --do-not-download-clip --exit
        env:
          PIP_DISABLE_PIP_VERSION_CHECK: "1"
          PIP_PROGRESS_BAR: "off"
          TORCH_INDEX_URL: https://download.pytorch.org/whl/cpu
          WEBUI_LAUNCH_LIVE_OUTPUT: "1"
          PYTHONUNBUFFERED: "1"
          STABLE_DIFFUSION_REPO: https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/Stability-AI/stablediffusion.git
          STABLE_DIFFUSION_XL_REPO: https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/Stability-AI/generative-models.git
      - name: Smoke startup
        run: |
          python launch.py --skip-prepare-environment --skip-torch-cuda-test --test-server --do-not-download-clip --no-half --disable-opt-split-attention --use-cpu all --api-server-stop --port 7860 &
          wait-for-it --service 127.0.0.1:7860 -t 60
          curl -s -X POST http://127.0.0.1:7860/sdapi/v1/server-stop || true
          wait
      - name: Print installed packages
        run: pip freeze
      - name: Start test server
        run: >
          python -m coverage run
          --data-file=.coverage.server
          launch.py
          --skip-prepare-environment
          --skip-torch-cuda-test
          --test-server
          --do-not-download-clip
          --no-half
          --disable-opt-split-attention
          --use-cpu all
          --api-server-stop
          --port 7860
          2>&1 | tee output.txt &
      - name: Run tests
        run: |
          wait-for-it --service 127.0.0.1:7860 -t 20
          python -m pytest -vv --junitxml=test/results.xml --cov . --cov-fail-under=60 --cov-report=xml --verify-base-url test
      - name: Kill test server
        if: always()
        run: curl -vv -XPOST http://127.0.0.1:7860/sdapi/v1/server-stop && sleep 10
      - name: Show coverage
        run: |
          python -m coverage combine .coverage*
          python -m coverage report -i
          python -m coverage html -i
      - name: Upload main app output
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: output
          path: output.txt
      - name: Upload coverage HTML
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: htmlcov
          path: htmlcov
